<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://www.googletagmanager.com https://www.google-analytics.com https://*.goatcounter.com https://gc.zgo.at; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://www.google-analytics.com https://*.goatcounter.com https://www.googletagmanager.com https://gc.zgo.at; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <!-- dns-prefetch only: analytics scripts load after explicit consent
         (see lib/analytics.ts), so no preconnect — an unused preconnect burns
         a TLS handshake on the critical path and hurts FCP. -->
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <link rel="dns-prefetch" href="https://gc.zgo.at" />
    <meta
      name="description"
      content="Every currently-claimable free AI credit offer, labeled with review status, verification level, and sign-up need, on one fast page."
    />
    <!-- Archivo paints the wordmark and every offer title, so it sits on the
         LCP path and is the one face worth preloading. The mono is not: it
         renders body text that swaps in without moving the layout. -->
    <link
      rel="preload"
      href="./fonts/archivo-var-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" sizes="16x16" />
    <link rel="icon" href="./logo-mark.svg" type="image/svg+xml" sizes="64x64" />
    <link rel="apple-touch-icon" href="./logo-icon.svg" sizes="512x512" />
    <link
      rel="alternate"
      type="application/rss+xml"
      title="Free AI Credits — free AI credit offers, tagged by verification"
      href="./feed.xml"
    />
    <link rel="alternate" type="text/markdown" title="LLM summary" href="./llms.txt" />
    <link rel="alternate" type="text/markdown" title="Full content for LLMs" href="./llms-full.txt" />
    <link rel="sitemap" type="application/xml" title="Sitemap" href="./sitemap.xml" />
    <title>Free AI Credits</title>
    <!-- Search Console verification injected at build when SEARCH_CONSOLE_TOKEN is set — see docs/search-console-setup.md -->
    <!-- free-ai-credits:social-meta:start -->
    <link rel="canonical" href="https://freetokens.custats.info/" />
    <meta property="og:title" content="Free AI Credits" />
    <meta
      property="og:description"
      content="Every currently-claimable free AI credit offer, labeled with review status, verification level, and sign-up need, on one fast page."
    />
    <meta property="og:url" content="https://freetokens.custats.info/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Free AI Credits" />
    <meta property="og:image" content="https://freetokens.custats.info/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Free AI Credits" />
    <meta
      name="twitter:description"
      content="Every currently-claimable free AI credit offer, labeled with review status, verification level, and sign-up need, on one fast page."
    />
    <meta name="twitter:image" content="https://freetokens.custats.info/og.png" />
    <!-- free-ai-credits:social-meta:end -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
