name: Site health (stale & deploy)

on:
  schedule:
    # Daily 08:00 UTC — matches PRD 7.4 "stale content" cadence.
    - cron: "0 8 * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]

permissions:
  contents: read

jobs:
  freshness:
    # Stale-content check runs on schedule / manual dispatch. The
    # workflow_run event is reserved for deploy-failure detection below.
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Check offer freshness
        id: health
        run: |
          set +e
          python3 scripts/check_site_health.py --json > /tmp/health.json
          code=$?
          cat /tmp/health.json
          echo "--- human report ---"
          python3 scripts/check_site_health.py || true
          # Also write the human report to the job summary (directly tied
          # to remediation: oldest-first list).
          {
            echo "## Site health — offer freshness"
            echo ""
            echo '```'
            python3 scripts/check_site_health.py || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Export stale flag for the next step.
          stale=$(python3 -c "import json; print(str(json.load(open('/tmp/health.json'))['stale']).lower())")
          echo "stale=$stale" >> "$GITHUB_OUTPUT"
          ratio=$(python3 -c "import json; d=json.load(open('/tmp/health.json')); print(f\"{d['ratio']:.0%}\")")
          echo "ratio=$ratio" >> "$GITHUB_OUTPUT"
          days=$(python3 -c "import json; print(json.load(open('/tmp/health.json'))['days_since_last'])")
          echo "days_since_last=$days" >> "$GITHUB_OUTPUT"
          # Exit 0 even when stale — alerting is via issue, not a red check
          # that would block deploys. Keep the summary visible either way.
          exit 0

      - name: Create or update stale-content issue
        if: steps.health.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # Deduplicate: only one open stale-content issue at a time.
          existing=$(gh issue list --state open --label "site-health" --search "Stale content" --json number --jq 'length')
          if [ "$existing" != "0" ]; then
            echo "An open site-health stale-content issue already exists — skipping creation."
            exit 0
          fi

          stale_reason=$(python3 -c "import json; print(json.load(open('/tmp/health.json'))['stale_reason'])")
          total=$(python3 -c "import json; print(json.load(open('/tmp/health.json'))['total'])")
          fresh=$(python3 -c "import json; print(json.load(open('/tmp/health.json'))['fresh'])")
          ratio="${{ steps.health.outputs.ratio }}"
          days="${{ steps.health.outputs.days_since_last }}"
          last=$(python3 -c "import json; print(json.load(open('/tmp/health.json'))['last_verified'])")

          # Build remediation table: oldest-first, top 20.
          table=$(python3 -c "
          import json
          data=json.load(open('/tmp/health.json'))
          lines=['| verified_date | age | slug | provider | file |','|---|---|---|---|---|']
          for e in data['oldest'][:20]:
              flag=' STALE' if e['stale'] else ''
              lines.append(f\"| {e['verified_date']} | {e['age_days']}d{flag} | {e['slug']} | {e['provider']} | {e['path']} |\")
          print('\n'.join(lines))
          ")

          body="Automated site-health check detected stale content.

          **Signal:** ${stale_reason}
          **Fresh-offer ratio:** ${ratio} (${fresh}/${total} within 14 days, threshold 70%)
          **Last verified:** ${last} (${days} days ago, threshold 14 days)

          **Remediation — re-verify from the top (oldest \`verified_date\` first):**

          ${table}

          ---
          _Workflow: \`${{ github.workflow }}\` · run \`${{ github.run_id }}\` · threshold \`--max-age-days 14 --min-ratio 0.70\` (see \`scripts/check_site_health.py\`)._
          _To reproduce locally:\`python3 scripts/check_site_health.py\` — dry-run on a stale fixture:\`python3 scripts/check_site_health.py --today 2099-01-01 --fail-on-stale\`_"

          gh issue create \
            --title "Site health: stale content — ${stale_reason}" \
            --label "site-health" \
            --body "$body" || echo "issue creation failed (label may be missing — will retry without label)"; \

          # Fallback without label if the label does not yet exist in the repo.
          if [ $? -ne 0 ]; then
            gh issue create --title "Site health: stale content — ${stale_reason}" --body "$body"
          fi

  deploy-failure:
    # PRD 7.4 High: only alert after the SECOND consecutive deploy failure
    # so a single flaky run / immediate retry does not spam.
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
    steps:
      - name: Check second consecutive deploy failure
        id: consecutive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          repo="${{ github.repository }}"
          # Resolve the Deploy workflow id by name.
          wf_id=$(gh api "repos/$repo/actions/workflows" --jq '.workflows[] | select(.name=="Deploy to GitHub Pages") | .id')
          if [ -z "$wf_id" ] || [ "$wf_id" = "null" ]; then
            echo "Could not resolve Deploy workflow id — skipping."
            echo "consecutive=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Deploy workflow id: $wf_id"
          # Last 2 runs on main (most recent first). workflow_run already
          # counts as the latest failure, so we need one more failure
          # immediately before it on the same branch.
          runs_json=$(gh api "repos/$repo/actions/workflows/$wf_id/runs?per_page=5&branch=main")
          # Extract last two conclusions
          c1=$(echo "$runs_json" | python3 -c "import sys,json; d=json.load(sys.stdin); r=d.get('workflow_runs',[]); print(r[0]['conclusion'] if len(r)>0 else '')")
          c2=$(echo "$runs_json" | python3 -c "import sys,json; d=json.load(sys.stdin); r=d.get('workflow_runs',[]); print(r[1]['conclusion'] if len(r)>1 else '')")
          echo "Last two deploy conclusions on main: [$c1, $c2]"
          {
            echo "## Deploy failure check"
            echo ""
            echo "Last two \`Deploy to GitHub Pages\` conclusions on \`main\`: \`$c1\`, \`$c2\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$c1" = "failure" ] && [ "$c2" = "failure" ]; then
            echo "consecutive=true" >> "$GITHUB_OUTPUT"
            echo "Second consecutive failure confirmed."
          else
            echo "consecutive=false" >> "$GITHUB_OUTPUT"
            echo "Not consecutive — no alert."
          fi

      - name: Open deploy-failure issue
        if: steps.consecutive.outputs.consecutive == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # Deduplicate: keep one open deploy-failure issue.
          existing=$(gh issue list --state open --label "site-health" --search "Deploy failed" --json number --jq 'length')
          if [ "$existing" != "0" ]; then
            echo "An open deploy-failure issue already exists — skipping."
            exit 0
          fi
          run_url="${{ github.event.workflow_run.html_url }}"
          body="Automated site-health check detected **2 consecutive failures** of \`Deploy to GitHub Pages\` on \`main\` (PRD 7.4 High).

          Latest failed run: ${run_url}

          **Expected response:** fix same day; site continues serving last good build.

          ---
          _Workflow: \`${{ github.workflow }}\` · run \`${{ github.run_id }}\` — triggered by \`workflow_run\` conclusion \`${{ github.event.workflow_run.conclusion }}\`._"

          gh issue create \
            --title "Site health: deploy failed 2× in a row on main" \
            --label "site-health" \
            --body "$body" || gh issue create --title "Site health: deploy failed 2× in a row on main" --body "$body"
