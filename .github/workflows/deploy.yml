name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
# Note: no v* tag trigger on purpose — the github-pages environment restricts
# deployments by branch pattern, so tag runs would always fail at the deploy
# job. Releases deploy via their tagged commit on main.

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Full history: the build reads each offer's first commit to
          # order the listing newest-added first. The default depth-1
          # checkout has no history, so git log returns nothing and the
          # order silently degrades to alphabetical.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Validate offer schema
        run: python3 scripts/validate_offers.py

      - name: Content-model tests
        run: python3 -m unittest tests/test_validate_offers.py tests/test_skill_validator.py

  build:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      # Wall-clock seconds spent inside this job, fed into the duration
      # budget enforced by the deploy job (#142).
      duration_s: ${{ steps.duration.outputs.duration_s }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Full history: the build reads each offer's first commit to
          # order the listing newest-added first. The default depth-1
          # checkout has no history, so git log returns nothing and the
          # order silently degrades to alphabetical.
          fetch-depth: 0

      - name: Start duration timer
        id: timer_start
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Run Node unit suites
        working-directory: app
        run: npm test

      - name: Build with Vite
        working-directory: app
        env:
          # Same optional analytics plumbing as the retired Python build:
          # unset/empty keeps GA4 and the traffic strip fully disabled.
          # Since the #138 cutover the Pages artifact comes from this Vite
          # output; #139 retired the legacy Python builder and site/ output.
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
          GOATCOUNTER_SITE_URL: ${{ secrets.GOATCOUNTER_SITE_URL }}
          SEARCH_CONSOLE_TOKEN: ${{ secrets.SEARCH_CONSOLE_TOKEN }}
        run: npm run build

      - name: Check SEO heads
        working-directory: app
        run: node scripts/check-seo.mjs

      - name: Stop duration timer
        id: duration
        if: always()
        run: echo "duration_s=$(( $(date +%s) - ${{ steps.timer_start.outputs.start }} ))" >> "$GITHUB_OUTPUT"

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Start duration timer
        id: timer_start
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Stop duration timer
        id: duration
        if: always()
        run: echo "duration_s=$(( $(date +%s) - ${{ steps.timer_start.outputs.start }} ))" >> "$GITHUB_OUTPUT"

      # Duration budget (#142): the Python build shipped a small page fast;
      # the Node pipeline must stay under 3 minutes of combined build+deploy
      # runner time. Durations are measured per job and summed — comparing
      # raw epochs across jobs would compare two different runners' clocks.
      - name: Enforce 3-minute build+deploy budget
        if: always()
        env:
          BUILD_S: ${{ needs.build.outputs.duration_s || 0 }}
          DEPLOY_S: ${{ steps.duration.outputs.duration_s || 0 }}
        run: |
          total=$((BUILD_S + DEPLOY_S))
          echo "build ${BUILD_S}s + deploy ${DEPLOY_S}s = ${total}s (budget 180s)"
          [ "$total" -le 180 ]
