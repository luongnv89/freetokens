name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
# Note: no v* tag trigger on purpose — the github-pages environment restricts
# deployments by branch pattern, so tag runs would always fail at the deploy
# job. Releases deploy via their tagged commit on main.

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Validate offer schema
        run: python3 scripts/validate_offers.py

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Build site
        env:
          # Optional: create a repo secret named GA_MEASUREMENT_ID (G-XXXXXXX)
          # to enable GA4. Unset/empty keeps analytics fully disabled.
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
          # Optional: live traffic stats (#62) via self-hosted Counterscale.
          # Set both secrets (worker https origin + registered site ID);
          # leaving either unset keeps traffic counting fully disabled.
          STATS_ENDPOINT: ${{ secrets.STATS_ENDPOINT }}
          STATS_SITE_ID: ${{ secrets.STATS_SITE_ID }}
        run: |
          python3 scripts/build.py
          python3 -m unittest discover -s tests

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
