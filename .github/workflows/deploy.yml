name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
# Note: no v* tag trigger on purpose — the github-pages environment restricts
# deployments by branch pattern, so tag runs would always fail at the deploy
# job. Releases deploy via their tagged commit on main.

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Validate offer schema
        run: python3 scripts/validate_offers.py

      - name: Content-model tests
        run: python3 -m unittest tests/test_validate_offers.py tests/test_skill_validator.py

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Run Node unit suites
        working-directory: app
        run: npm test

      - name: Build with Vite
        working-directory: app
        env:
          # Same optional analytics plumbing as the retired Python build:
          # unset/empty keeps GA4 and the traffic strip fully disabled.
          # Since the #138 cutover the Pages artifact comes from this Vite
          # output; #139 retired the legacy Python builder and site/ output.
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
          GOATCOUNTER_SITE_URL: ${{ secrets.GOATCOUNTER_SITE_URL }}
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
