name: Validate offers

on:
  push:
    paths:
      - "offers/**"
  pull_request:
    paths:
      - "offers/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate offer schema
        run: python3 scripts/validate_offers.py
