name: Validate offers

on:
  # Offer pushes get the dedicated validation workflow; pull requests stay
  # unfiltered so the required `validate` check is always reported.
  push:
    paths:
      - "offers/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Full history: the build reads each offer's first commit to
          # order the listing newest-added first. The default depth-1
          # checkout has no history, so git log returns nothing and the
          # order silently degrades to alphabetical.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Validate offer schema
        run: python3 scripts/validate_offers.py

  node-tests:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Full history: the build reads each offer's first commit to
          # order the listing newest-added first. The default depth-1
          # checkout has no history, so git log returns nothing and the
          # order silently degrades to alphabetical.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Run Node unit suites
        working-directory: app
        run: npm test

      - name: Build with Vite
        working-directory: app
        run: npm run build

      - name: Check SEO heads
        working-directory: app
        run: node scripts/check-seo.mjs

      - name: Set up Python for SEO audit (Task 3.6)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Run SEO audit (dist filter, no .tsx noise)
        working-directory: app
        run: npm run audit:seo -- --fail-on-critical

      # Performance budgets (#142): Lighthouse asserts Performance >= 0.84 and
      # Accessibility >= 0.90 on the home listing, the archive, and an offer
      # detail page (assertions in app/lighthouserc.json) against the built
      # static dist. Uses the runner's preinstalled Chrome when present, else
      # the one puppeteer fetched during npm ci.
      # FCP median cap is 1650ms: main already fails the old 1550ms floor
      # (1554ms on 118ef64) and CI medians sit on a ~15ms knife-edge.
      #
      # The detail page is picked from whatever dist/offers/ contains right
      # now — prerender drops expired offers, so a hard-coded slug would 404
      # once it lapses. --collect.url replaces the config file's list.
      - name: Run Lighthouse CI budgets
        working-directory: app
        run: |
          CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || true)"
          export CHROME_PATH
          DETAIL_URL="http://localhost/$(ls dist/offers/*.html | head -1 | sed 's|^dist/||')"
          npx --no-install lhci autorun \
            --collect.staticDistDir=dist \
            --collect.url="http://localhost/" \
            --collect.url="http://localhost/archive.html" \
            --collect.url="$DETAIL_URL"

      - name: Install Playwright browsers
        working-directory: app
        run: npx playwright install --with-deps

      - name: Run Playwright e2e
        working-directory: app
        run: npm run test:e2e
